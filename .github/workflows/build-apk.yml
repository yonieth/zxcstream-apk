name: Build Android Mobile, Android TV & Windows Apps

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  # ==========================================
  # JOB 1: ANDROID MOBILE / TABLET APK
  # ==========================================
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install dependencies
        run: npm install

      - name: Generate ZXC Stream Icon & Splash Screen
        run: |
          node -e '
          const fs = require("fs");
          const sharp = require("sharp");
          fs.mkdirSync("assets", { recursive: true });
          const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024"><rect width="1024" height="1024" fill="#000000"/><g transform="translate(180, 180) scale(1.296875)"><polygon points="315,245 352,282 275,359 238,322" fill="#4A1C1C"/><path d="M 42,52 L 502,52 Q 512,52 504,62 L 154,412 L 320,412 L 385,332 L 504,452 Q 512,460 500,460 L 12,460 Q 0,460 8,450 L 358,100 L 92,100 L 36,60 Q 32,52 42,52 Z" fill="#D60000"/></g></svg>`;
          const splashSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2732 2732" width="2732" height="2732"><rect width="2732" height="2732" fill="#000000"/><g transform="translate(1034, 1034) scale(1.296875)"><polygon points="315,245 352,282 275,359 238,322" fill="#4A1C1C"/><path d="M 42,52 L 502,52 Q 512,52 504,62 L 154,412 L 320,412 L 385,332 L 504,452 Q 512,460 500,460 L 12,460 Q 0,460 8,450 L 358,100 L 92,100 L 36,60 Q 32,52 42,52 Z" fill="#D60000"/></g></svg>`;
          (async () => {
            await sharp(Buffer.from(svg)).png().toFile("assets/icon.png");
            await sharp(Buffer.from(svg)).png().toFile("assets/icon-foreground.png");
            await sharp({ create: { width: 1024, height: 1024, channels: 4, background: { r: 0, g: 0, b: 0, alpha: 1 } } }).png().toFile("assets/icon-background.png");
            await sharp(Buffer.from(splashSvg)).png().toFile("assets/splash.png");
            await sharp(Buffer.from(splashSvg)).png().toFile("assets/splash-dark.png");
          })();
          '

      - name: Generate Android Platform & Apply Icons
        run: |
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#000000' --iconBackgroundColorDark '#000000' --splashBackgroundColor '#000000' --splashBackgroundColorDark '#000000'
          npx cap sync android

      - name: Inject Fullscreen, Auto-Rotation & Ad-Blocker (Base64 Safe)
        run: |
          node -e '
          const fs = require("fs");
          let manifest = fs.readFileSync("android/app/src/main/AndroidManifest.xml", "utf8");
          manifest = manifest.replace("<application", "<application android:usesCleartextTraffic=\"true\" android:hardwareAccelerated=\"true\"");
          manifest = manifest.replace("android:name=\".MainActivity\"", "android:name=\".MainActivity\" android:screenOrientation=\"fullSensor\"");
          fs.writeFileSync("android/app/src/main/AndroidManifest.xml", manifest);

          const b64Java = "";
          fs.writeFileSync("android/app/src/main/java/com/zxcstream/app/MainActivity.java", Buffer.from(b64Java, "base64").toString("utf8"));
          '

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Compiled Android APK
        uses: actions/upload-artifact@v4
        with:
          name: ZXC-Stream-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

  # ==========================================
  # JOB 2: FAST ANDROID TV APK (TURBO + AUTO-FULLSCREEN + DOUBLE-BACK EXIT)
  # ==========================================
  build-android-tv:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install dependencies
        run: npm install

      - name: Generate ZXC Stream Icon & Splash Screen
        run: |
          node -e '
          const fs = require("fs");
          const sharp = require("sharp");
          fs.mkdirSync("assets", { recursive: true });
          const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024"><rect width="1024" height="1024" fill="#000000"/><g transform="translate(180, 180) scale(1.296875)"><polygon points="315,245 352,282 275,359 238,322" fill="#4A1C1C"/><path d="M 42,52 L 502,52 Q 512,52 504,62 L 154,412 L 320,412 L 385,332 L 504,452 Q 512,460 500,460 L 12,460 Q 0,460 8,450 L 358,100 L 92,100 L 36,60 Q 32,52 42,52 Z" fill="#D60000"/></g></svg>`;
          const splashSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2732 2732" width="2732" height="2732"><rect width="2732" height="2732" fill="#000000"/><g transform="translate(1034, 1034) scale(1.296875)"><polygon points="315,245 352,282 275,359 238,322" fill="#4A1C1C"/><path d="M 42,52 L 502,52 Q 512,52 504,62 L 154,412 L 320,412 L 385,332 L 504,452 Q 512,460 500,460 L 12,460 Q 0,460 8,450 L 358,100 L 92,100 L 36,60 Q 32,52 42,52 Z" fill="#D60000"/></g></svg>`;
          (async () => {
            await sharp(Buffer.from(svg)).png().toFile("assets/icon.png");
            await sharp(Buffer.from(svg)).png().toFile("assets/icon-foreground.png");
            await sharp({ create: { width: 1024, height: 1024, channels: 4, background: { r: 0, g: 0, b: 0, alpha: 1 } } }).png().toFile("assets/icon-background.png");
            await sharp(Buffer.from(splashSvg)).png().toFile("assets/splash.png");
            await sharp(Buffer.from(splashSvg)).png().toFile("assets/splash-dark.png");
          })();
          '

      - name: Generate Android Platform & Apply Icons
        run: |
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#000000' --iconBackgroundColorDark '#000000' --splashBackgroundColor '#000000' --splashBackgroundColorDark '#000000'
          npx cap sync android

      - name: Inject Turbo TV Engine, Auto-Fullscreen Movie View & Double-Back Exit (Base64 Safe)
        run: |
          node -e '
          const fs = require("fs");
          const sharp = require("sharp");

          // 1. Create drawable directory first so sharp never fails
          fs.mkdirSync("android/app/src/main/res/drawable", { recursive: true });

          // 2. Patch AndroidManifest.xml with Hardware Acceleration, LargeHeap & TV Leanback Support
          let manifest = fs.readFileSync("android/app/src/main/AndroidManifest.xml", "utf8");
          const tvFeatures = "<uses-feature android:name=\"android.hardware.touchscreen\" android:required=\"false\" /><uses-feature android:name=\"android.software.leanback\" android:required=\"false\" />";
          manifest = manifest.replace("<application", tvFeatures + "<application android:usesCleartextTraffic=\"true\" android:hardwareAccelerated=\"true\" android:largeHeap=\"true\" android:banner=\"@drawable/tv_banner\"");
          manifest = manifest.replace("android:name=\".MainActivity\"", "android:name=\".MainActivity\" android:screenOrientation=\"sensorLandscape\"");
          manifest = manifest.replace("<category android:name=\"android.intent.category.LAUNCHER\" />", "<category android:name=\"android.intent.category.LAUNCHER\" /><category android:name=\"android.intent.category.LEANBACK_LAUNCHER\" />");
          fs.writeFileSync("android/app/src/main/AndroidManifest.xml", manifest);

          // 3. Upgrade our verified Base64 Java class with TV Turbo Speed, Auto-Fullscreen & Double-Back Protection
          const b64Java = "";

          let javaSrc = Buffer.from(b64Java, "base64").toString("utf8");

          // Add TV imports (KeyEvent, View, Toast)
          javaSrc = javaSrc.replace(
            "import android.os.Bundle;",
            "import android.os.Bundle;\nimport android.view.KeyEvent;\nimport android.view.View;\nimport android.widget.Toast;"
          );

          // Add lastBackPressTime field
          javaSrc = javaSrc.replace(
            "public class MainActivity extends BridgeActivity {",
            "public class MainActivity extends BridgeActivity {\n    private long lastBackPressTime = 0;"
          );

          // Enable Hardware Layer & High Cache Performance in onStart()
          const tvPerf = Buffer.from("", "base64").toString("utf8");
          javaSrc = javaSrc.replace(
            "settings.setMediaPlaybackRequiresUserGesture(false);",
            "settings.setMediaPlaybackRequiresUserGesture(false);\n            " + tvPerf
          );

          // Add onPageFinished Auto-Fullscreen Movie Expander & TV Lag Remover
          const onPageFinishedMethod = Buffer.from("", "base64").toString("utf8");
          javaSrc = javaSrc.replace(
            "return super.shouldOverrideUrlLoading(view, request);\n                }",
            "return super.shouldOverrideUrlLoading(view, request);\n                }\n                " + onPageFinishedMethod
          );

          // Add Smart Remote Back/Exit Protection (Go Back a Page or Double-Press to Exit)
          const backButtonProtection = Buffer.from("", "base64").toString("utf8");
          javaSrc = javaSrc.replace(
            "@Override\n    public void startActivity(Intent intent)",
            backButtonProtection + "\n\n    @Override\n    public void startActivity(Intent intent)"
          );

          fs.writeFileSync("android/app/src/main/java/com/zxcstream/app/MainActivity.java", javaSrc);

          // 4. Render 320x180 TV Home Banner into drawable/tv_banner.png
          const tvBannerSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180"><rect width="320" height="180" fill="#0B0B0B"/><g transform="translate(102, 32) scale(0.225)"><polygon points="315,245 352,282 275,359 238,322" fill="#4A1C1C"/><path d="M 42,52 L 502,52 Q 512,52 504,62 L 154,412 L 320,412 L 385,332 L 504,452 Q 512,460 500,460 L 12,460 Q 0,460 8,450 L 358,100 L 92,100 L 36,60 Q 32,52 42,52 Z" fill="#D60000"/></g></svg>`;
          (async () => {
            await sharp(Buffer.from(tvBannerSvg)).resize(320, 180).png().toFile("android/app/src/main/res/drawable/tv_banner.png");
          })();
          '

      - name: Build Android TV Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Compiled Android TV APK
        uses: actions/upload-artifact@v4
        with:
          name: ZXC-Stream-Android-TV-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

  # ==========================================
  # JOB 3: WINDOWS SETUP .EXE INSTALLER
  # ==========================================
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create Isolated Windows Electron Project (Base64 Safe)
        shell: bash
        run: |
          mkdir -p win-app/build
          cd win-app
          node -e '
          const fs = require("fs");
          const b64Pkg = "";
          const b64Main = "";
          fs.writeFileSync("package.json", Buffer.from(b64Pkg, "base64").toString("utf8"));
          fs.writeFileSync("main.js", Buffer.from(b64Main, "base64").toString("utf8"));
          '
          npm install
          node -e '
          const sharp = require("sharp");
          const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024"><rect width="1024" height="1024" fill="#000000" rx="180"/><g transform="translate(180, 180) scale(1.296875)"><polygon points="315,245 352,282 275,359 238,322" fill="#4A1C1C"/><path d="M 42,52 L 502,52 Q 512,52 504,62 L 154,412 L 320,412 L 385,332 L 504,452 Q 512,460 500,460 L 12,460 Q 0,460 8,450 L 358,100 L 92,100 L 36,60 Q 32,52 42,52 Z" fill="#D60000"/></g></svg>`;
          (async () => {
            await sharp(Buffer.from(svg)).resize(512, 512).png().toFile("build/icon.png");
          })();
          '

      - name: Build Windows Setup .EXE with NSIS Wizard
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          cd win-app
          npx electron-builder --win nsis --x64

      - name: Upload Windows Setup Installer (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: ZXC-Stream-Windows-Installer
          path: win-app/dist/*.exe
