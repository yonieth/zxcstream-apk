name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install Capacitor dependencies
        run: npm install

      - name: Prepare ZXC Stream Icon & Splash Assets
        run: |
          mkdir -p assets
          if [ -f "brand.0skne4t7ee-cp.png" ]; then
            # If you uploaded the raw 512x512 PNG to the repo root, pad and upscale to 1024x1024
            convert "brand.0skne4t7ee-cp.png" -resize 680x680 -background "#000000" -gravity center -extent 1024x1024 assets/icon.png
            convert "brand.0skne4t7ee-cp.png" -resize 680x680 -background none -gravity center -extent 1024x1024 assets/icon-foreground.png
          elif [ ! -f "assets/icon.png" ]; then
            # Render the exact ZXC Stream logo directly at 1024x1024 with Android Adaptive safe-zone padding
            cat << 'EOF' > zxc_logo.svg
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
            <g transform="translate(180, 180) scale(1.296875)">
              <!-- Dark shadow crossbar -->
              <polygon points="315,245 352,282 275,359 238,322" fill="#4A1C1C"/>
              <!-- Main Red Z shape -->
              <path d="M 42,52 L 502,52 Q 512,52 504,62 L 154,412 L 320,412 L 385,332 L 504,452 Q 512,460 500,460 L 12,460 Q 0,460 8,450 L 358,100 L 92,100 L 36,60 Q 32,52 42,52 Z" fill="#D60000"/>
            </g>
          </svg>
          EOF
            convert -background none zxc_logo.svg assets/icon-foreground.png
            convert -background "#000000" zxc_logo.svg -flatten assets/icon.png
          fi
          # Create solid black background layer & 2732x2732 splash screen
          convert -size 1024x1024 xc:"#000000" assets/icon-background.png
          convert assets/icon.png -background "#000000" -gravity center -extent 2732x2732 assets/splash.png
          cp assets/splash.png assets/splash-dark.png

      - name: Generate Android Platform & Apply Icons
        run: |
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#000000' --iconBackgroundColorDark '#000000' --splashBackgroundColor '#000000' --splashBackgroundColorDark '#000000'
          npx cap sync android

      - name: Configure Fullscreen, Ad-Blocking & Video Support
        run: |
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/g' android/app/src/main/AndroidManifest.xml
          sed -i 's/android:configChanges="[^"]*"/android:configChanges="orientation|keyboardHidden|keyboard|screenSize|locale|smallestScreenSize|screenLayout|uiMode"/g' android/app/src/main/AndroidManifest.xml

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Compiled APK
        uses: actions/upload-artifact@v4
        with:
          name: ZXC-Stream-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
