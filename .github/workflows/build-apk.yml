name: Build Android Mobile, Android TV & Windows Apps

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  # ==========================================
  # JOB 1: ANDROID MOBILE / TABLET APK
  # ==========================================
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install dependencies
        run: npm install

      - name: Generate ZXC Stream Icon & Splash Screen
        run: |
          node -e '
          const fs = require("fs");
          const sharp = require("sharp");
          fs.mkdirSync("assets", { recursive: true });
          const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024"><rect width="1024" height="1024" fill="#000000"/><g transform="translate(180, 180) scale(1.296875)"><polygon points="315,245 352,282 275,359 238,322" fill="#4A1C1C"/><path d="M 42,52 L 502,52 Q 512,52 504,62 L 154,412 L 320,412 L 385,332 L 504,452 Q 512,460 500,460 L 12,460 Q 0,460 8,450 L 358,100 L 92,100 L 36,60 Q 32,52 42,52 Z" fill="#D60000"/></g></svg>`;
          const splashSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2732 2732" width="2732" height="2732"><rect width="2732" height="2732" fill="#000000"/><g transform="translate(1034, 1034) scale(1.296875)"><polygon points="315,245 352,282 275,359 238,322" fill="#4A1C1C"/><path d="M 42,52 L 502,52 Q 512,52 504,62 L 154,412 L 320,412 L 385,332 L 504,452 Q 512,460 500,460 L 12,460 Q 0,460 8,450 L 358,100 L 92,100 L 36,60 Q 32,52 42,52 Z" fill="#D60000"/></g></svg>`;
          (async () => {
            await sharp(Buffer.from(svg)).png().toFile("assets/icon.png");
            await sharp(Buffer.from(svg)).png().toFile("assets/icon-foreground.png");
            await sharp({ create: { width: 1024, height: 1024, channels: 4, background: { r: 0, g: 0, b: 0, alpha: 1 } } }).png().toFile("assets/icon-background.png");
            await sharp(Buffer.from(splashSvg)).png().toFile("assets/splash.png");
            await sharp(Buffer.from(splashSvg)).png().toFile("assets/splash-dark.png");
          })();
          '

      - name: Generate Android Platform & Apply Icons
        run: |
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#000000' --iconBackgroundColorDark '#000000' --splashBackgroundColor '#000000' --splashBackgroundColorDark '#000000'
          npx cap sync android

      - name: Inject Fullscreen, Auto-Rotation & Ad-Blocker (Base64 Safe)
        run: |
          node -e '
          const fs = require("fs");
          let manifest = fs.readFileSync("android/app/src/main/AndroidManifest.xml", "utf8");
          manifest = manifest.replace("<application", "<application android:usesCleartextTraffic=\"true\" android:hardwareAccelerated=\"true\"");
          manifest = manifest.replace("android:name=\".MainActivity\"", "android:name=\".MainActivity\" android:screenOrientation=\"fullSensor\"");
          fs.writeFileSync("android/app/src/main/AndroidManifest.xml", manifest);

          const b64Java = "";
          fs.writeFileSync("android/app/src/main/java/com/zxcstream/app/MainActivity.java", Buffer.from(b64Java, "base64").toString("utf8"));
          '

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Compiled Android APK
        uses: actions/upload-artifact@v4
        with:
          name: ZXC-Stream-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

  # ==========================================
  # JOB 2: FAST ANDROID TV APK (TURBO + AUTO-FULLSCREEN + DOUBLE-BACK EXIT)
  # ==========================================
  build-android-tv:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install dependencies
        run: npm install

      - name: Generate ZXC Stream Icon & Splash Screen
        run: |
          node -e '
          const fs = require("fs");
          const sharp = require("sharp");
          fs.mkdirSync("assets", { recursive: true });
          const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024"><rect width="1024" height="1024" fill="#000000"/><g transform="translate(180, 180) scale(1.296875)"><polygon points="315,245 352,282 275,359 238,322" fill="#4A1C1C"/><path d="M 42,52 L 502,52 Q 512,52 504,62 L 154,412 L 320,412 L 385,332 L 504,452 Q 512,460 500,460 L 12,460 Q 0,460 8,450 L 358,100 L 92,100 L 36,60 Q 32,52 42,52 Z" fill="#D60000"/></g></svg>`;
          const splashSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2732 2732" width="2732" height="2732"><rect width="2732" height="2732" fill="#000000"/><g transform="translate(1034, 1034) scale(1.296875)"><polygon points="315,245 352,282 275,359 238,322" fill="#4A1C1C"/><path d="M 42,52 L 502,52 Q 512,52 504,62 L 154,412 L 320,412 L 385,332 L 504,452 Q 512,460 500,460 L 12,460 Q 0,460 8,450 L 358,100 L 92,100 L 36,60 Q 32,52 42,52 Z" fill="#D60000"/></g></svg>`;
          (async () => {
            await sharp(Buffer.from(svg)).png().toFile("assets/icon.png");
            await sharp(Buffer.from(svg)).png().toFile("assets/icon-foreground.png");
            await sharp({ create: { width: 1024, height: 1024, channels: 4, background: { r: 0, g: 0, b: 0, alpha: 1 } } }).png().toFile("assets/icon-background.png");
            await sharp(Buffer.from(splashSvg)).png().toFile("assets/splash.png");
            await sharp(Buffer.from(splashSvg)).png().toFile("assets/splash-dark.png");
          })();
          '

      - name: Generate Android Platform & Apply Icons
        run: |
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#000000' --iconBackgroundColorDark '#000000' --splashBackgroundColor '#000000' --splashBackgroundColorDark '#000000'
          npx cap sync android

      - name: Inject Turbo TV Engine, Auto-Fullscreen Movie View & Double-Back Exit
        run: |
          node -e '
          const fs = require("fs");
          const sharp = require("sharp");

          // 1. Patch AndroidManifest.xml with Hardware Acceleration, LargeHeap & TV Leanback Support
          let manifest = fs.readFileSync("android/app/src/main/AndroidManifest.xml", "utf8");
          const tvFeatures = "<uses-feature android:name=\"android.hardware.touchscreen\" android:required=\"false\" /><uses-feature android:name=\"android.software.leanback\" android:required=\"false\" />";
          manifest = manifest.replace("<application", tvFeatures + "<application android:usesCleartextTraffic=\"true\" android:hardwareAccelerated=\"true\" android:largeHeap=\"true\" android:banner=\"@drawable/tv_banner\"");
          manifest = manifest.replace("android:name=\".MainActivity\"", "android:name=\".MainActivity\" android:screenOrientation=\"sensorLandscape\"");
          manifest = manifest.replace("<category android:name=\"android.intent.category.LAUNCHER\" />", "<category android:name=\"android.intent.category.LAUNCHER\" /><category android:name=\"android.intent.category.LEANBACK_LAUNCHER\" />");
          fs.writeFileSync("android/app/src/main/AndroidManifest.xml", manifest);

          // 2. Write Turbo Android TV MainActivity.java (Base64 Verified)
          const b64TvJava = " V9BQ0NFTEVSQVRFRCk7CiAgICAgICAgaGlkZVN5c3RlbUJhcnMoKTsKICAgIH0KfQo=";

          const tvJavaLines = [
            "package com.zxcstream.app;",
            "import android.content.Intent;",
            "import android.os.Bundle;",
            "import android.view.KeyEvent;",
            "import android.view.View;",
            "import android.view.ViewGroup;",
            "import android.view.WindowManager;",
            "import android.webkit.WebChromeClient;",
            "import android.webkit.WebResourceRequest;",
            "import android.webkit.WebResourceResponse;",
            "import android.webkit.WebSettings;",
            "import android.webkit.WebView;",
            "import android.widget.FrameLayout;",
            "import android.widget.Toast;",
            "import androidx.core.view.WindowCompat;",
            "import androidx.core.view.WindowInsetsCompat;",
            "import androidx.core.view.WindowInsetsControllerCompat;",
            "import com.getcapacitor.BridgeActivity;",
            "import com.getcapacitor.BridgeWebViewClient;",
            "import java.io.ByteArrayInputStream;",
            "import java.util.Arrays;",
            "import java.util.List;",
            "",
            "public class MainActivity extends BridgeActivity {",
            "    private static final List<String> AD_HOSTS = Arrays.asList(",
            "        \"doubleclick.net\", \"googlesyndication.com\", \"googleadservices.com\",",
            "        \"popads.net\", \"popcash.net\", \"propellerads.com\", \"adsterra.com\",",
            "        \"exoclick.com\", \"juicyads.com\", \"hilltopads.net\", \"clickadu.com\",",
            "        \"onclkds.com\", \"adsco.re\", \"trafficjunky.net\", \"yandex.ru\",",
            "        \"histats.com\", \"acint.net\", \"adtng.com\", \"a-ads.com\",",
            "        \"brightadnetwork.com\", \"onclickalgo.com\", \"pushame.com\", \"bet365\", \"1xbet\"",
            "    );",
            "    private View customView = null;",
            "    private WebChromeClient.CustomViewCallback customViewCallback = null;",
            "    private long lastBackPressTime = 0;",
            "",
            "    @Override",
            "    public void onCreate(Bundle savedInstanceState) {",
            "        super.onCreate(savedInstanceState);",
            "        getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);",
            "        getWindow().addFlags(WindowManager.LayoutParams.FLAG_HARDWARE_ACCELERATED);",
            "        hideSystemBars();",
            "    }",
            "",
            "    @Override",
            "    public void onStart() {",
            "        super.onStart();",
            "        if (this.bridge != null && this.bridge.getWebView() != null) {",
            "            final WebView webView = this.bridge.getWebView();",
            "            // 1. Hardware GPU Acceleration & Turbo Cache for Android TV",
            "            webView.setLayerType(View.LAYER_TYPE_HARDWARE, null);",
            "            WebSettings settings = webView.getSettings();",
            "            settings.setJavaScriptCanOpenWindowsAutomatically(false);",
            "            settings.setSupportMultipleWindows(false);",
            "            settings.setMediaPlaybackRequiresUserGesture(false);",
            "            settings.setCacheMode(WebSettings.LOAD_DEFAULT);",
            "            settings.setDomStorageEnabled(true);",
            "            settings.setRenderPriority(WebSettings.RenderPriority.HIGH);",
            "            webView.setFocusable(true);",
            "            webView.setFocusableInTouchMode(true);",
            "            webView.requestFocus();",
            "",
            "            // 2. Native Fullscreen Video Handler",
            "            webView.setWebChromeClient(new WebChromeClient() {",
            "                @Override",
            "                public void onShowCustomView(View view, CustomViewCallback callback) {",
            "                    if (customView != null) {",
            "                        callback.onCustomViewHidden();",
            "                        return;",
            "                    }",
            "                    customView = view;",
            "                    customViewCallback = callback;",
            "                    ViewGroup decor = (ViewGroup) getWindow().getDecorView();",
            "                    decor.addView(customView, new FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));",
            "                    webView.setVisibility(View.GONE);",
            "                    hideSystemBars();",
            "                }",
            "                @Override",
            "                public void onHideCustomView() {",
            "                    if (customView == null) return;",
            "                    ViewGroup decor = (ViewGroup) getWindow().getDecorView();",
            "                    decor.removeView(customView);",
            "                    customView = null;",
            "                    if (customViewCallback != null) customViewCallback.onCustomViewHidden();",
            "                    webView.setVisibility(View.VISIBLE);",
            "                    hideSystemBars();",
            "                }",
            "            });",
            "",
            "            // 3. Ad-Blocker + Auto-Fullscreen Movie Expander + Lag Remover",
            "            final String tvOptimizeJs = Buffer.from(\"\", \"base64\").toString(\"utf8\");",
            "",
            "            webView.setWebViewClient(new BridgeWebViewClient(this.bridge) {",
            "                @Override",
            "                public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {",
            "                    String url = request.getUrl().toString().toLowerCase();",
            "                    for (String adHost : AD_HOSTS) {",
            "                        if (url.contains(adHost)) {",
            "                            return new WebResourceResponse(\"text/plain\", \"utf-8\", new ByteArrayInputStream(new byte[0]));",
            "                        }",
            "                    }",
            "                    return super.shouldInterceptRequest(view, request);",
            "                }",
            "                @Override",
            "                public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {",
            "                    String url = request.getUrl().toString().toLowerCase();",
            "                    if (request.isForMainFrame() && !url.contains(\"zxcstream.com\")) {",
            "                        return true;",
            "                    }",
            "                    return super.shouldOverrideUrlLoading(view, request);",
            "                }",
            "                @Override",
            "                public void onPageFinished(WebView view, String url) {",
            "                    super.onPageFinished(view, url);",
            "                    view.evaluateJavascript(" + JSON.stringify(Buffer.from("", "base64").toString("utf8")) + ", null);",
            "                }",
            "            });",
            "        }",
            "    }",
            "",
            "    // 4. Smart Remote Back / Exit Button Protection (Never Close on Single Press)",
            "    @Override",
            "    public boolean dispatchKeyEvent(KeyEvent event) {",
            "        int keyCode = event.getKeyCode();",
            "        if ((keyCode == KeyEvent.KEYCODE_BACK || keyCode == KeyEvent.KEYCODE_ESCAPE) && event.getAction() == KeyEvent.ACTION_DOWN) {",
            "            handleTvBackButton();",
            "            return true;",
            "        }",
            "        return super.dispatchKeyEvent(event);",
            "    }",
            "",
            "    @Override",
            "    public void onBackPressed() {",
            "        handleTvBackButton();",
            "    }",
            "",
            "    private void handleTvBackButton() {",
            "        if (customView != null) {",
            "            ViewGroup decor = (ViewGroup) getWindow().getDecorView();",
            "            decor.removeView(customView);",
            "            customView = null;",
            "            if (customViewCallback != null) customViewCallback.onCustomViewHidden();",
            "            if (this.bridge != null && this.bridge.getWebView() != null) {",
            "                this.bridge.getWebView().setVisibility(View.VISIBLE);",
            "            }",
            "            return;",
            "        }",
            "        if (this.bridge != null && this.bridge.getWebView() != null && this.bridge.getWebView().canGoBack()) {",
            "            this.bridge.getWebView().goBack();",
            "            return;",
            "        }",
            "        long now = System.currentTimeMillis();",
            "        if (now - lastBackPressTime < 2000) {",
            "            finish();",
            "        } else {",
            "            lastBackPressTime = now;",
            "            Toast.makeText(this, \"Press Back again to exit ZXC Stream\", Toast.LENGTH_SHORT).show();",
            "        }",
            "    }",
            "",
            "    @Override",
            "    public void startActivity(Intent intent) {",
            "        if (intent != null && Intent.ACTION_VIEW.equals(intent.getAction())) {",
            "            return;",
            "        }",
            "        super.startActivity(intent);",
            "    }",
            "",
            "    @Override",
            "    public void onWindowFocusChanged(boolean hasFocus) {",
            "        super.onWindowFocusChanged(hasFocus);",
            "        if (hasFocus) hideSystemBars();",
            "    }",
            "",
            "    private void hideSystemBars() {",
            "        WindowCompat.setDecorFitsSystemWindows(getWindow(), false);",
            "        WindowInsetsControllerCompat controller = WindowCompat.getInsetsController(getWindow(), getWindow().getDecorView());",
            "        if (controller != null) {",
            "            controller.hide(WindowInsetsCompat.Type.systemBars());",
            "            controller.setSystemBarsBehavior(WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);",
            "        }",
            "    }",
            "}"
          ];
          fs.writeFileSync("android/app/src/main/java/com/zxcstream/app/MainActivity.java", tvJavaLines.join(String.fromCharCode(10)));

          // 3. Render 320x180 TV Home Banner into drawable/tv_banner.png
          const tvBannerSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180"><rect width="320" height="180" fill="#0B0B0B"/><g transform="translate(102, 32) scale(0.225)"><polygon points="315,245 352,282 275,359 238,322" fill="#4A1C1C"/><path d="M 42,52 L 502,52 Q 512,52 504,62 L 154,412 L 320,412 L 385,332 L 504,452 Q 512,460 500,460 L 12,460 Q 0,460 8,450 L 358,100 L 92,100 L 36,60 Q 32,52 42,52 Z" fill="#D60000"/></g></svg>`;
          (async () => {
            await sharp(Buffer.from(tvBannerSvg)).resize(320, 180).png().toFile("android/app/src/main/res/drawable/tv_banner.png");
          })();
          '

      - name: Build Android TV Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Compiled Android TV APK
        uses: actions/upload-artifact@v4
        with:
          name: ZXC-Stream-Android-TV-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

  # ==========================================
  # JOB 3: WINDOWS SETUP .EXE INSTALLER
  # ==========================================
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create Isolated Windows Electron Project (Base64 Safe)
        shell: bash
        run: |
          mkdir -p win-app/build
          cd win-app
          node -e '
          const fs = require("fs");
          const b64Pkg = "";
          const b64Main = "";
          fs.writeFileSync("package.json", Buffer.from(b64Pkg, "base64").toString("utf8"));
          fs.writeFileSync("main.js", Buffer.from(b64Main, "base64").toString("utf8"));
          '
          npm install
          node -e '
          const sharp = require("sharp");
          const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024"><rect width="1024" height="1024" fill="#000000" rx="180"/><g transform="translate(180, 180) scale(1.296875)"><polygon points="315,245 352,282 275,359 238,322" fill="#4A1C1C"/><path d="M 42,52 L 502,52 Q 512,52 504,62 L 154,412 L 320,412 L 385,332 L 504,452 Q 512,460 500,460 L 12,460 Q 0,460 8,450 L 358,100 L 92,100 L 36,60 Q 32,52 42,52 Z" fill="#D60000"/></g></svg>`;
          (async () => {
            await sharp(Buffer.from(svg)).resize(512, 512).png().toFile("build/icon.png");
          })();
          '

      - name: Build Windows Setup .EXE with NSIS Wizard
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          cd win-app
          npx electron-builder --win nsis --x64

      - name: Upload Windows Setup Installer (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: ZXC-Stream-Windows-Installer
          path: win-app/dist/*.exe
