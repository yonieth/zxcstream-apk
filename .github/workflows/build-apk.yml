          constYour workflow run **#13 (`Build Android APK & Windows Installer`)** ran for **1m 58s** before failing[cite: 3]. Because the Android build takes ~1m 45s to finish[cite: 2], a failure at the 1m 58s mark means the `build-windows` job failed right at the end during the `npx electron-builder --win nsis --x64` packaging step.

This happens for two specific reasons in `electron-builder`:
1. **`files` packaging conflict:** Without an explicit `"files"` array in `package.json`, `electron-builder` tries to bundle the entire repository (or fails if `electron-main.js` wasn't saved before `sharp` finished its async image write).
2. **Async Icon Race Condition:** In the previous script, `sharp(...).toFile("assets/icon.png")` was called without `await`, meaning `electron-builder` started before `assets/icon.png` finished writing to disk.

Here is the exact fix to make both `build-android` and `build-windows` pass with green checkmarks.

---

### Step 1: Update `package.json`
Add `"files": ["electron-main.js", "assets/**/*", "package.json"]` to the `"build"` section so `electron-builder` only packages the necessary Windows files cleanly.

1. Open **`package.json`** in your GitHub repository and click the **Edit (pencil)** icon.
2. Replace the entire file with this exact JSON:

```json
{
  "name": "zxcstream-app",
  "version": "1.0.0",
  "description": "ZXC Stream Official App",
  "author": "ZXC Stream",
  "main": "electron-main.js",
  "dependencies": {
    "@capacitor/android": "^6.0.0",
    "@capacitor/cli": "^6.0.0",
    "@capacitor/core": "^6.0.0"
  },
  "devDependencies": {
    "@capacitor/assets": "^3.0.5",
    "electron": "^30.0.0",
    "electron-builder": "^24.13.3",
    "sharp": "^0.33.0"
  },
  "build": {
    "appId": "com.zxcstream.app",
    "productName": "ZXC Stream",
    "files": [
      "electron-main.js",
      "assets/**/*",
      "package.json"
    ],
    "win": {
      "target": "nsis",
      "icon": "assets/icon.png"
    },
    "nsis": {
      "oneClick": false,
      "allowToChangeInstallationDirectory": true,
      "createDesktopShortcut": true,
      "createStartMenuShortcut": true,
      "shortcutName": "ZXC Stream"
    }
  }
}
