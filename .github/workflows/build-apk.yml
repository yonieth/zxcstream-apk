name: Build Android & Windows Apps

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install Wine (Required to stamp .ico onto Windows .exe)
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y wine64 wine32 imagemagick

      - name: Install Capacitor dependencies
        run: npm install

      - name: Generate ZXC Stream Icon & Splash Screen via Node
        run: |
          node -e '
          const fs = require("fs");
          const sharp = require("sharp");
          fs.mkdirSync("assets", { recursive: true });
          const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024"><rect width="1024" height="1024" fill="#000000"/><g transform="translate(180, 180) scale(1.296875)"><polygon points="315,245 352,282 275,359 238,322" fill="#4A1C1C"/><path d="M 42,52 L 502,52 Q 512,52 504,62 L 154,412 L 320,412 L 385,332 L 504,452 Q 512,460 500,460 L 12,460 Q 0,460 8,450 L 358,100 L 92,100 L 36,60 Q 32,52 42,52 Z" fill="#D60000"/></g></svg>`;
          const splashSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2732 2732" width="2732" height="2732"><rect width="2732" height="2732" fill="#000000"/><g transform="translate(1034, 1034) scale(1.296875)"><polygon points="315,245 352,282 275,359 238,322" fill="#4A1C1C"/><path d="M 42,52 L 502,52 Q 512,52 504,62 L 154,412 L 320,412 L 385,332 L 504,452 Q 512,460 500,460 L 12,460 Q 0,460 8,450 L 358,100 L 92,100 L 36,60 Q 32,52 42,52 Z" fill="#D60000"/></g></svg>`;
          (async () => {
            await sharp(Buffer.from(svg)).png().toFile("assets/icon.png");
            await sharp(Buffer.from(svg)).png().toFile("assets/icon-foreground.png");
            await sharp({ create: { width: 1024, height: 1024, channels: 4, background: { r: 0, g: 0, b: 0, alpha: 1 } } }).png().toFile("assets/icon-background.png");
            await sharp(Buffer.from(splashSvg)).png().toFile("assets/splash.png");
            await sharp(Buffer.from(splashSvg)).png().toFile("assets/splash-dark.png");
            await sharp(Buffer.from(svg)).resize(256, 256).png().toFile("assets/icon-256.png");
          })();
          '
          convert assets/icon-256.png assets/icon.ico

      - name: Generate Android Platform & Apply Icons
        run: |
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#000000' --iconBackgroundColorDark '#000000' --splashBackgroundColor '#000000' --splashBackgroundColorDark '#000000'
          npx cap sync android

      - name: Enable Immersive Fullscreen & Auto-Rotation (Android)
        run: |
          node -e '
          const fs = require("fs");
          let manifest = fs.readFileSync("android/app/src/main/AndroidManifest.xml", "utf8");
          manifest = manifest.replace("<application", "<application android:usesCleartextTraffic=\"true\"");
          manifest = manifest.replace(
            "android:name=\".MainActivity\"",
            "android:name=\".MainActivity\" android:screenOrientation=\"fullSensor\""
          );
          fs.writeFileSync("android/app/src/main/AndroidManifest.xml", manifest);

          const javaCode = `package com.zxcstream.app;

          import android.os.Bundle;
          import android.view.WindowManager;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  hideSystemBars();
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) {
                      hideSystemBars();
                  }
              }

              private void hideSystemBars() {
                  WindowCompat.setDecorFitsSystemWindows(getWindow(), false);
                  WindowInsetsControllerCompat controller = WindowCompat.getInsetsController(getWindow(), getWindow().getDecorView());
                  if (controller != null) {
                      controller.hide(WindowInsetsCompat.Type.systemBars());
                      controller.setSystemBarsBehavior(WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
                  }
              }
          }
          `;
          fs.writeFileSync("android/app/src/main/java/com/zxcstream/app/MainActivity.java", javaCode.trim());
          '

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Build Windows Desktop App (.exe)
        run: |
          npx nativefier "https://zxcstream.com/" \
            --name "ZXC Stream" \
            --platform "windows" \
            --arch "x64" \
            --icon "assets/icon.ico" \
            --background-color "#000000" \
            --single-instance \
            --internal-urls ".*zxcstream\.com.*" \
            windows-build

      - name: Upload Compiled Android APK
        uses: actions/upload-artifact@v4
        with:
          name: ZXC-Stream-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Compiled Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: ZXC-Stream-Windows-EXE
          path: windows-build/ZXC Stream-win32-x64/
