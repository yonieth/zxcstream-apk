name: Build Android APK & Windows Installer

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install dependencies
        run: npm install

      - name: Generate ZXC Stream Icon & Splash Screen
        run: |
          node -e '
          const fs = require("fs");
          const sharp = require("sharp");
          fs.mkdirSync("assets", { recursive: true });
          const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024"><rect width="1024" height="1024" fill="#000000"/><g transform="translate(180, 180) scale(1.296875)"><polygon points="315,245 352,282 275,359 238,322" fill="#4A1C1C"/><path d="M 42,52 L 502,52 Q 512,52 504,62 L 154,412 L 320,412 L 385,332 L 504,452 Q 512,460 500,460 L 12,460 Q 0,460 8,450 L 358,100 L 92,100 L 36,60 Q 32,52 42,52 Z" fill="#D60000"/></g></svg>`;
          const splashSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2732 2732" width="2732" height="2732"><rect width="2732" height="2732" fill="#000000"/><g transform="translate(1034, 1034) scale(1.296875)"><polygon points="315,245 352,282 275,359 238,322" fill="#4A1C1C"/><path d="M 42,52 L 502,52 Q 512,52 504,62 L 154,412 L 320,412 L 385,332 L 504,452 Q 512,460 500,460 L 12,460 Q 0,460 8,450 L 358,100 L 92,100 L 36,60 Q 32,52 42,52 Z" fill="#D60000"/></g></svg>`;
          (async () => {
            await sharp(Buffer.from(svg)).png().toFile("assets/icon.png");
            await sharp(Buffer.from(svg)).png().toFile("assets/icon-foreground.png");
            await sharp({ create: { width: 1024, height: 1024, channels: 4, background: { r: 0, g: 0, b: 0, alpha: 1 } } }).png().toFile("assets/icon-background.png");
            await sharp(Buffer.from(splashSvg)).png().toFile("assets/splash.png");
            await sharp(Buffer.from(splashSvg)).png().toFile("assets/splash-dark.png");
          })();
          '

      - name: Generate Android Platform & Apply Icons
        run: |
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#000000' --iconBackgroundColorDark '#000000' --splashBackgroundColor '#000000' --splashBackgroundColorDark '#000000'
          npx cap sync android

      - name: Inject Fullscreen, Auto-Rotation & Smart Ad-Blocker
        run: |
          node -e '
          const fs = require("fs");
          let manifest = fs.readFileSync("android/app/src/main/AndroidManifest.xml", "utf8");
          manifest = manifest.replace("<application", "<application android:usesCleartextTraffic=\"true\"");
          manifest = manifest.replace("android:name=\".MainActivity\"", "android:name=\".MainActivity\" android:screenOrientation=\"fullSensor\"");
          fs.writeFileSync("android/app/src/main/AndroidManifest.xml", manifest);

          const javaCode = [
            "package com.zxcstream.app;",
            "import android.content.Intent;",
            "import android.os.Bundle;",
            "import android.view.WindowManager;",
            "import android.webkit.WebResourceRequest;",
            "import android.webkit.WebResourceResponse;",
            "import android.webkit.WebSettings;",
            "import android.webkit.WebView;",
            "import androidx.core.view.WindowCompat;",
            "import androidx.core.view.WindowInsetsCompat;",
            "import androidx.core.view.WindowInsetsControllerCompat;",
            "import com.getcapacitor.BridgeActivity;",
            "import com.getcapacitor.BridgeWebViewClient;",
            "import java.io.ByteArrayInputStream;",
            "import java.util.Arrays;",
            "import java.util.List;",
            "",
            "public class MainActivity extends BridgeActivity {",
            "    private static final List<String> AD_HOSTS = Arrays.asList(",
            "        \"doubleclick.net\", \"googlesyndication.com\", \"googleadservices.com\",",
            "        \"popads.net\", \"popcash.net\", \"propellerads.com\", \"adsterra.com\",",
            "        \"exoclick.com\", \"juicyads.com\", \"hilltopads.net\", \"clickadu.com\",",
            "        \"onclkds.com\", \"adsco.re\", \"trafficjunky.net\", \"yandex.ru\",",
            "        \"histats.com\", \"acint.net\", \"adtng.com\", \"a-ads.com\",",
            "        \"brightadnetwork.com\", \"onclickalgo.com\", \"pushame.com\", \"bet365\", \"1xbet\"",
            "    );",
            "",
            "    @Override",
            "    public void onCreate(Bundle savedInstanceState) {",
            "        super.onCreate(savedInstanceState);",
            "        getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);",
            "        hideSystemBars();",
            "    }",
            "",
            "    @Override",
            "    public void onStart() {",
            "        super.onStart();",
            "        if (this.bridge != null && this.bridge.getWebView() != null) {",
            "            WebView webView = this.bridge.getWebView();",
            "            WebSettings settings = webView.getSettings();",
            "            settings.setJavaScriptCanOpenWindowsAutomatically(false);",
            "            settings.setSupportMultipleWindows(false);",
            "            settings.setMediaPlaybackRequiresUserGesture(false);",
            "",
            "            webView.setWebViewClient(new BridgeWebViewClient(this.bridge) {",
            "                @Override",
            "                public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {",
            "                    String url = request.getUrl().toString().toLowerCase();",
            "                    for (String adHost : AD_HOSTS) {",
            "                        if (url.contains(adHost)) {",
            "                            return new WebResourceResponse(\"text/plain\", \"utf-8\", new ByteArrayInputStream(new byte[0]));",
            "                        }",
            "                    }",
            "                    return super.shouldInterceptRequest(view, request);",
            "                }",
            "",
            "                @Override",
            "                public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {",
            "                    String url = request.getUrl().toString().toLowerCase();",
            "                    if (request.isForMainFrame() && !url.contains(\"zxcstream.com\")) {",
            "                        return true;",
            "                    }",
            "                    return super.shouldOverrideUrlLoading(view, request);",
            "                }",
            "",
            "                @Override",
            "                public void onPageFinished(WebView view, String url) {",
            "                    super.onPageFinished(view, url);",
            "                    view.evaluateJavascript(\"window.open = function() { return null; };\", null);",
            "                }",
            "            });",
            "        }",
            "    }",
            "",
            "    @Override",
            "    public void startActivity(Intent intent) {",
            "        if (intent != null && Intent.ACTION_VIEW.equals(intent.getAction())) {",
            "            return;",
            "        }",
            "        super.startActivity(intent);",
            "    }",
            "",
            "    @Override",
            "    public void onWindowFocusChanged(boolean hasFocus) {",
            "        super.onWindowFocusChanged(hasFocus);",
            "        if (hasFocus) hideSystemBars();",
            "    }",
            "",
            "    private void hideSystemBars() {",
            "        WindowCompat.setDecorFitsSystemWindows(getWindow(), false);",
            "        WindowInsetsControllerCompat controller = WindowCompat.getInsetsController(getWindow(), getWindow().getDecorView());",
            "        if (controller != null) {",
            "            controller.hide(WindowInsetsCompat.Type.systemBars());",
            "            controller.setSystemBarsBehavior(WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);",
            "        }",
            "    }",
            "}"
          ].join("\n");
          fs.writeFileSync("android/app/src/main/java/com/zxcstream/app/MainActivity.java", javaCode);
          '

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Compiled Android APK
        uses: actions/upload-artifact@v4
        with:
          name: ZXC-Stream-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create Isolated Windows Electron Installer Project
        shell: bash
        run: |
          mkdir -p win-app
          cd win-app
          npm init -y
          npm install --save-dev electron@30.0.0 electron-builder@24.13.3 sharp@0.33.0
          node -e '
          const fs = require("fs");
          const sharp = require("sharp");

          const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024"><rect width="1024" height="1024" fill="#000000" rx="180"/><g transform="translate(180, 180) scale(1.296875)"><polygon points="315,245 352,282 275,359 238,322" fill="#4A1C1C"/><path d="M 42,52 L 502,52 Q 512,52 504,62 L 154,412 L 320,412 L 385,332 L 504,452 Q 512,460 500,460 L 12,460 Q 0,460 8,450 L 358,100 L 92,100 L 36,60 Q 32,52 42,52 Z" fill="#D60000"/></g></svg>`;

          const mainJs = [
            "const { app, BrowserWindow } = require(\"electron\");",
            "const path = require(\"path\");",
            "function createWindow() {",
            "  const win = new BrowserWindow({",
            "    width: 1280, height: 800, backgroundColor: \"#000000\",",
            "    title: \"ZXC Stream\", icon: path.join(__dirname, \"icon.png\"),",
            "    autoHideMenuBar: true,",
            "    webPreferences: { nodeIntegration: false, contextIsolation: true }",
            "  });",
            "  win.maximize();",
            "  win.loadURL(\"https://zxcstream.com/\");",
            "  win.webContents.setWindowOpenHandler(() => ({ action: \"deny\" }));",
            "}",
            "app.whenReady().then(createWindow);",
            "app.on(\"window-all-closed\", () => { if (process.platform !== \"darwin\") app.quit(); });"
          ].join("\n");

          fs.writeFileSync("main.js", mainJs);

          const pkg = {
            name: "zxcstream-desktop",
            version: "1.0.0",
            description: "ZXC Stream Desktop App",
            author: "ZXC Stream",
            main: "main.js",
            devDependencies: {
              electron: "30.0.0",
              "electron-builder": "24.13.3"
            },
            build: {
              appId: "com.zxcstream.desktop",
              productName: "ZXC Stream",
              files: ["main.js", "icon.png", "package.json"],
              win: { target: "nsis", icon: "icon.png" },
              nsis: {
                oneClick: false,
                allowToChangeInstallationDirectory: true,
                createDesktopShortcut: true,
                createStartMenuShortcut: true,
                shortcutName: "ZXC Stream"
              }
            }
          };

          fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2));

          (async () => {
            await sharp(Buffer.from(svg)).resize(512, 512).png().toFile("icon.png");
            console.log("Icon ready");
          })();
          '

      - name: Build Windows Setup .EXE with NSIS Wizard
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          cd win-app
          npx electron-builder --win nsis --x64

      - name: Upload Windows Setup Installer (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: ZXC-Stream-Windows-Installer
          path: win-app/dist/*.exe
